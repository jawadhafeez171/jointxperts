<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400" fill="none" stroke="currentColor" stroke-width="2">
  <!-- Head (shoulders) -->
  <circle cx="100" cy="70" r="30" fill="#f0f0f0" />
  <!-- Shoulders -->
  <circle cx="50" cy="130" r="15" fill="#ffcc00" />
  <circle cx="150" cy="130" r="15" fill="#ffcc00" />
  <!-- Elbows -->
  <circle cx="30" cy="200" r="12" fill="#66ccff" />
  <circle cx="170" cy="200" r="12" fill="#66ccff" />
  <!-- Wrists -->
  <circle cx="20" cy="260" r="10" fill="#ff6699" />
  <circle cx="180" cy="260" r="10" fill="#ff6699" />
  <!-- Torso -->
  <rect x="70" y="130" width="60" height="150" fill="#e6e6e6" />
  <!-- Hips -->
  <circle cx="70" cy="300" r="20" fill="#99ff99" />
  <circle cx="130" cy="300" r="20" fill="#99ff99" />
  <!-- Knees -->
  <circle cx="70" cy="350" r="15" fill="#ff9966" />
  <circle cx="130" cy="350" r="15" fill="#ff9966" />
  <!-- Ankles -->
  <circle cx="70" cy="390" r="12" fill="#cc66ff" />
  <circle cx="130" cy="390" r="12" fill="#cc66ff" />
</svg>
